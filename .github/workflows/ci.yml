name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --extra notebooks --extra dev --python "${{ matrix.python }}"
      - run: uv run --locked ruff check src scripts tests
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python scripts/local/check_publication.py
      - run: uv run --locked python -m ipykernel install --sys-prefix --name python3
      - run: uv run --locked python -m jupyter nbconvert --execute --to notebook --output /tmp/results.ipynb notebooks/resultados_experimentos.ipynb --ExecutePreprocessor.timeout=180
  model-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r configs/requirements-control.txt
      - run: python -m unittest discover -s tests -v
